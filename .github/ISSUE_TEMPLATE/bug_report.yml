name: Bug report
description: Report a problem with Pet Feeder Card.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove personal data before posting, including entity names you consider private.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: card_version
    attributes:
      label: Card version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or app
  - type: textarea
    id: config
    attributes:
      label: Card configuration (YAML)
      render: yaml
  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
